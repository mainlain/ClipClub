[package]
name = "clipclub"
version = "0.1.0"
edition = "2024"
description = "A small peer-to-peer video commons"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:tao", "dep:wry", "dep:gtk"]
bundle-ffprobe = []

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
libp2p = { version = "0.57.1", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "mdns", "macros", "ed25519", "dns"] }
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls", "disable-upload"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["limit"] }
tao = { version = "0.37.1", optional = true }
wry = { version = "0.57.1", optional = true }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
